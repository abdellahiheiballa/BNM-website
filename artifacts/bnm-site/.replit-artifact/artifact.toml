kind = "web"
previewPath = "/"
title = "BNM - Banque Nationale de Mauritanie"
version = "1.0.0"
id = "artifacts/bnm-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21145

[services.development]
run = "pnpm --filter @workspace/bnm-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bnm-site", "run", "build" ]
publicDir = "artifacts/bnm-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21145"
BASE_PATH = "/"
